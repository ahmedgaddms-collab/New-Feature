<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMS - الفيديو التوضيحي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>

    <div class="background-decor shadow-1"></div>
    <div class="background-decor shadow-2"></div>

    <div class="main-container">
        <div class="logo-box">
            <span class="logo-text">DMS SYSTEM</span>
        </div>
        <h1 class="main-title">شاهد طريقة استخدام التطبيق عملياً</h1>

        <div class="system-window">
            <div class="window-header">
                <div class="window-controls">
                    <span class="window-dot dot-1"></span>
                    <span class="window-dot dot-2"></span>
                    <span class="window-dot dot-3"></span>
                </div>
                <div class="window-address-bar">dms-eg.com / Demo-Video</div>
                <span class="window-badge">HD Video</span>
            </div>

            <div class="window-content">
                <video controls playsinline preload="metadata">
                    <source src="WhatsApp Video 2026-11-12 at 17.02.09.mp4" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
            </div>
        </div>
    </div>

</body>
</html>
